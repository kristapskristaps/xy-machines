name: Collection checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPEN_XY_REF: 6941bc8a18e622d520cff6c9503121c6518e8fa3
  OPEN_XY_REPOSITORY: etcetc000/open-xy
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xy-machines
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Preview tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Source history audit
        working-directory: xy-machines
        run: python tools/check_private_files.py --history --all-objects
      - name: Development workflow tests
        working-directory: xy-machines
        run: python -m unittest discover -s tests
      - name: Machine previews and host tests
        working-directory: xy-machines
        run: python tools/check.py --sdk ../open-xy --cxx clang++ --host-cxx g++
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xy-machines
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned Blackfin toolchain
        working-directory: open-xy
        run: python sdk.py toolchain fetch
      - name: Compile each machine
        working-directory: xy-machines
        run: python tools/check.py --sdk ../open-xy --native-only
