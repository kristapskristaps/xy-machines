name: Collection checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xy-machines
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the collection SDK pin
        id: sdk
        working-directory: xy-machines
        run: python tools/ci_sdk.py
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.sdk.outputs.repository }}
          ref: ${{ steps.sdk.outputs.revision }}
          path: open-xy
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Preview tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Source history audit
        working-directory: xy-machines
        run: python tools/check_private_files.py --history --all-objects
      - name: Development workflow tests
        working-directory: xy-machines
        run: python -m unittest discover -s tests
      - name: Machine previews and host tests
        working-directory: xy-machines
        run: python tools/check.py --sdk ../open-xy --cxx clang++ --host-cxx g++
      - name: Build first-release synth auditions
        working-directory: xy-machines
        run: |
          for machine in acidline mando matter subvista vader weave westfold; do
            python ../open-xy/sdk.py preview --machine "machines/$machine" --out "local/release-previews/$machine" --cxx clang++
          done
      - name: Upload first-release synth auditions
        uses: actions/upload-artifact@v7
        with:
          name: first-ten-synth-previews
          path: xy-machines/local/release-previews
          if-no-files-found: error
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xy-machines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the collection SDK pin
        id: sdk
        working-directory: xy-machines
        run: python tools/ci_sdk.py
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.sdk.outputs.repository }}
          ref: ${{ steps.sdk.outputs.revision }}
          path: open-xy
      - name: Pinned Blackfin toolchain
        working-directory: open-xy
        run: python sdk.py toolchain fetch
      - name: Compile each machine
        working-directory: xy-machines
        run: python tools/check.py --sdk ../open-xy --native-only
