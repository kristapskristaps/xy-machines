name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Development follows staging; pin a compatible SDK commit for a release.
  OPEN_XY_REF: staging
jobs:
  machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Machine source, preview and sound checks
        run: python open-xy/sdk.py test --machine machine --cxx clang++ --host-cxx g++
      - name: Sanitizers
        run: |
          for source in machine/tests/*.cpp; do
            clang++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Iopen-xy/sdk/include "$source" -o "$RUNNER_TEMP/halo-test"
            "$RUNNER_TEMP/halo-test"
          done
      - name: Shared browser DSP and worklet
        run: |
          python machine/tools/audition.py --sdk open-xy --out "$RUNNER_TEMP/halo-audition" --cxx clang++
          clang++ -std=c++11 -O2 -Iopen-xy/sdk/include machine/tests/parity.cpp -o "$RUNNER_TEMP/halo-parity"
          node machine/tools/check_audition.mjs "$RUNNER_TEMP/halo-audition" "$("$RUNNER_TEMP/halo-parity")"
  firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy-core-machines
          path: core-machines
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Native compile (no stock firmware or device)
        run: python open-xy/sdk.py compile --machine machine --machine core-machines/machines/fm2op --out "${{ runner.temp }}/module"
