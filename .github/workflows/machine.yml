name: Machine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Synthesis drum support is on sdk/drum-synthesis, not staging yet.
  OPEN_XY_REF: 1b4892dea9803ad10d3175ecdb17aa860d199c37
jobs:
  machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Machine source, preview and sound checks
        run: python open-xy/sdk.py test --machine machine --cxx clang++ --host-cxx g++
      - name: Real SDK pad editor and storage integration
        run: python machine/tests/sdk_integration.py --sdk open-xy --cxx g++
      - name: Real native drum audio transport
        run: python machine/tests/native_audio.py --sdk open-xy --cxx g++
      - name: Full browser audition
        run: |
          python open-xy/sdk.py preview --machine machine --out "$RUNNER_TEMP/x0x-browser" --cxx clang++
          X0X_PREVIEW_WASM="$RUNNER_TEMP/x0x-browser/engine.wasm" node --test machine/tests/audition.test.mjs
  firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machine
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Native compile (no stock firmware or device)
        run: python open-xy/sdk.py compile --machine machine --out "${{ runner.temp }}/module"
