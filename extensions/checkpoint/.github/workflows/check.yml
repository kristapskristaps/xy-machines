name: Extension checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: extension
      - uses: actions/checkout@v4
        with:
          repository: kristapskristaps/open-xy
          ref: 3f404664aa0eb7d819862a93a83047ca1c3a51fd
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Private-data guard
        working-directory: extension
        run: python ../sdk/tools/check_private_files.py --tree HEAD
      - name: Extension contracts and gesture tests
        run: python sdk/sdk.py test --extension extension
